<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Kódolabky — testy enginu</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; margin: 2rem auto; max-width: 60rem; padding-inline: 1rem;
         background: #14110c; color: #eee6d8; }
  h1 { font-family: system-ui, sans-serif; }
  .sum { padding: .8rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-size: 1.1rem; }
  .sum.ok { background: #1d4b32; } .sum.bad { background: #6b2118; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .35rem .5rem; border-bottom: 1px solid #2e2820; vertical-align: top; }
  .pass { color: #7fd39b; } .fail { color: #ff9b86; }
  .name { width: 60%; }
</style>
</head>
<body>
<h1>Kódolabky — testy enginu</h1>
<div class="sum" id="sum">Bežia testy…</div>
<table><tbody id="out"></tbody></table>

<script type="module">
import { World } from '../src/engine/world.js';
import { VM, run } from '../src/engine/vm.js';
import { countRows, rowLimitFor, expandRows } from '../src/engine/program.js';
import { AWARDS, pointsFor, rankFor, nextRank, normalizeCallsign } from '../src/game/progress.js';
import { cleanNick, nickProblem, topOf, mergeEntry } from '../src/game/leaderboard.js';
import { HALL_SIZE } from '../src/game/config.js';

const results = [];
const test = (name, fn) => {
  try { fn(); results.push([name, null]); }
  catch (err) { results.push([name, err.message]); }
};
const ok = (cond, msg) => { if (!cond) throw new Error(msg ?? 'nesplnené'); };
const eq = (a, b, msg) => ok(Object.is(a, b), `${msg ?? ''} — dostal ${JSON.stringify(a)}, čakal ${JSON.stringify(b)}`);

const withIds = (rows) => rows.map((r, i) => ({ ...r, id: `t${i}` }));

const LEVEL = {
  id: 'test', title: 'test',
  grid: { legend: { '.': 'empty', '#': 'wall', o: 'bone', f: 'fire', g: 'goal' },
          rows: ['#####', '#..o#', '#..f#', '#..g#', '#####'] },
  actors: [{ id: 'a1', char: 'fifo', x: 1, y: 1, dir: 'E' }],
  goals: [{ type: 'reach', actor: 'a1', tile: 'goal' }],
};

// ── Svet ────────────────────────────────────────────────────────
test('svet načíta rozmery a dlaždice', () => {
  const w = new World(LEVEL);
  eq(w.w, 5, 'šírka'); eq(w.h, 5, 'výška');
  eq(w.tileAt(0, 0), 'wall', 'okraj je stena');
  eq(w.tileAt(3, 3), 'goal', 'cieľ');
});

test('predmety sú nad prázdnou dlaždicou, nie namiesto nej', () => {
  const w = new World(LEVEL);
  eq(w.tileAt(3, 1), 'empty', 'pod kosťou je prázdno');
  eq(w.itemAt(3, 1), 'bone', 'kosť');
  eq(w.totalBones, 1, 'počet kostí');
});

test('mimo mapy sa správa ako stena', () => {
  const w = new World(LEVEL);
  ok(w.isBlocked(-1, 1), 'vľavo od mapy');
  ok(w.isBlocked(99, 99), 'ďaleko mimo');
});

test('oheň blokuje pohyb', () => {
  const w = new World(LEVEL);
  ok(w.isBlocked(3, 2), 'políčko s ohňom');
});

// ── Interpret ───────────────────────────────────────────────────
test('relatívny pohyb: vpred sa posunie o jedno políčko', () => {
  const w = new World(LEVEL);
  const vm = new VM(w, withIds([{ cmd: 'move', n: 1 }]));
  vm.step();
  eq(w.actor.x, 2, 'x'); eq(w.actor.y, 1, 'y');
});

// V tabuľke je jeden riadok = jeden krok, ale interpret vie aj viactaktový
// riadok — to je základ pre `Opakuj n×` v Svete 2.
test('viactaktový riadok drží kurzor na tom istom riadku (základ pre Opakuj)', () => {
  const w = new World(LEVEL);
  const vm = new VM(w, withIds([{ cmd: 'move', n: 2 }]));
  const e1 = vm.step();
  eq(e1[0].rowId, 't0', 'prvý takt');
  eq(w.actor.x, 2, 'po prvom takte');
  const e2 = vm.step();
  eq(e2[0].rowId, 't0', 'druhý takt je stále ten istý riadok');
  eq(w.actor.x, 3, 'po druhom takte');
});

test('expandRows rozbalí {cmd, n} na samostatné riadky', () => {
  const rows = expandRows([{ cmd: 'move', n: 3 }, { cmd: 'turnRight' }]);
  eq(rows.length, 4, 'počet riadkov');
  eq(rows[2].cmd, 'move', 'tretí riadok');
  eq(rows[3].cmd, 'turnRight', 'štvrtý riadok');
  ok(rows.every((r) => r.n === undefined), 'riadky nemajú počet opakovaní');
});

test('otáčanie mení smer v správnom poradí', () => {
  const w = new World(LEVEL);
  const vm = new VM(w, withIds([{ cmd: 'turnRight' }, { cmd: 'turnRight' }, { cmd: 'turnLeft' }]));
  vm.step(); eq(w.actor.dir, 'S', 'E → vpravo');
  vm.step(); eq(w.actor.dir, 'W', 'S → vpravo');
  vm.step(); eq(w.actor.dir, 'S', 'W → vľavo');
});

test('absolútny príkaz najprv otočí, potom posunie', () => {
  const w = new World(LEVEL);
  const vm = new VM(w, withIds([{ cmd: 'south', n: 1 }]));
  vm.step();
  eq(w.actor.dir, 'S', 'smer'); eq(w.actor.y, 2, 'y');
});

test('náraz do steny zastaví program a označí riadok', () => {
  const w = new World(LEVEL);
  const { vm, events } = run(w, withIds([{ cmd: 'south', n: 3 }]));
  eq(vm.status, 'error', 'stav'); eq(vm.errorCode, 'wall', 'kód');
  const blocked = events.find((e) => e.type === 'blocked');
  ok(blocked, 'udalosť blocked'); eq(blocked.rowId, 't0', 'riadok');
});

test('kosť sa zoberie prechodom cez políčko', () => {
  const w = new World(LEVEL);
  run(w, withIds([{ cmd: 'east', n: 2 }]));
  eq(w.bonesCollected(), 1, 'pozbierané'); eq(w.itemAt(3, 1), null, 'kosť zmizla');
});

test('použi uhasí oheň na políčku, na ktoré sa pes pozerá', () => {
  const w = new World(LEVEL);
  run(w, withIds([{ cmd: 'move', n: 2 }, { cmd: 'turnRight' }, { cmd: 'use' }, { cmd: 'move', n: 2 }]));
  eq(w.itemAt(3, 2), null, 'oheň uhasený');
});

test('použi mimo ohňa nespraví nič a program beží ďalej', () => {
  const w = new World(LEVEL);
  const { vm, events } = run(w, withIds([{ cmd: 'use' }, { cmd: 'south', n: 2 }, { cmd: 'east', n: 2 }]));
  ok(events.some((e) => e.type === 'nothing'), 'udalosť nothing');
  eq(vm.status, 'won', 'program pokračoval až do cieľa');
});

// V absolútnom režime sa pes nedá otočiť bez pohybu — `Použi` preto vždy mieri
// tam, kam naposledy kráčal. Levely s ohňom naň musia viesť „čelne“.
test('absolútny režim: použi mieri tam, kam pes naposledy kráčal', () => {
  const w = new World(LEVEL);
  run(w, withIds([{ cmd: 'south', n: 1 }, { cmd: 'east', n: 1 }, { cmd: 'use' }]));
  eq(w.actor.dir, 'E', 'smer po poslednom kroku');
  eq(w.itemAt(3, 2), null, 'oheň pred psom uhasený');
});

test('dosiahnutie cieľa vyhráva', () => {
  const w = new World(LEVEL);
  const { vm } = run(w, withIds([{ cmd: 'south', n: 2 }, { cmd: 'east', n: 2 }]));
  eq(vm.status, 'won', 'stav');
});

test('minutý plán bez cieľa = prehra, nie tichý koniec', () => {
  const w = new World(LEVEL);
  const { vm } = run(w, withIds([{ cmd: 'south', n: 1 }]));
  eq(vm.status, 'lost', 'stav'); eq(vm.errorCode, 'notFinished', 'kód');
});

test('ochrana proti zacykleniu zastaví beh', () => {
  const w = new World(LEVEL);
  const { vm } = run(w, withIds([{ cmd: 'turnLeft' }, { cmd: 'turnRight' }]), { stepLimit: 5 });
  ok(vm.status === 'error' || vm.status === 'lost', `stav ${vm.status}`);
});

test('reset vráti svet do pôvodného stavu', () => {
  const w = new World(LEVEL);
  run(w, withIds([{ cmd: 'east', n: 2 }]));
  w.reset();
  eq(w.actor.x, 1, 'x'); eq(w.bonesCollected(), 0, 'kosti'); eq(w.itemAt(3, 1), 'bone', 'kosť späť');
});

// ── Bodovanie ───────────────────────────────────────────────────
// Čisté funkcie, nesiahajú na localStorage — testovateľné priamo.

test('body sa scitavaju len za skutocne ziskane ocenenia', () => {
  eq(pointsFor(['finish']), 100, 'iba splnena misia');
  eq(pointsFor(['finish', 'rows', 'bones', 'clean']), 250, 'vsetko');
  eq(pointsFor([]), 0, 'nic');
  eq(pointsFor(['vymyslene']), 0, 'neznamy id sa ignoruje');
});

test('bonus za bezchybny prechod je presne polovica zakladu', () => {
  const clean = AWARDS.find((a) => a.id === 'clean');
  ok(clean, 'ocenenie clean existuje');
  eq(clean.points, 50, 'body');
});

test('hodnost rastie s bodmi a nikdy nepadne pod prvu', () => {
  eq(rankFor(0).name, 'Šteniatko', '0 bodov');
  eq(rankFor(149).name, 'Šteniatko', 'tesne pod hranicou');
  eq(rankFor(150).name, 'Pomocník', 'presne na hranici');
  eq(rankFor(999999).name, 'Hlavný dispečer', 'vela bodov');
});

test('dalsia hodnost sa hlasi len kym nejaka je', () => {
  eq(nextRank(0).name, 'Pomocník', 'zo Steniatka');
  eq(nextRank(0).at - 0, 150, 'chybajuce body');
  eq(nextRank(999999), null, 'na vrchole uz dalsia nie je');
});

test('volaci znak sa upravi na radiovy tvar a zachova diakritiku', () => {
  eq(normalizeCallsign('ninka ľ'), 'NINKA Ľ', 'velke pismena + diakritika');
  eq(normalizeCallsign('  veliteľ   9  '), 'VELITEĽ 9', 'orezanie a jedna medzera');
  eq(normalizeCallsign('a<script>b'), 'ASCRIPTB', 'znaky mimo pismen a cisel vypadnu');
  eq(normalizeCallsign('123456789012345'), '1234567890', 'orezanie na 10 znakov');
  eq(normalizeCallsign('   '), '', 'prazdny znak neprejde');
  eq(normalizeCallsign(null), '', 'null neprejde');
});

// ── Sieň slávy ──────────────────────────────────────────────────

const entry = (nick, points, at = '2026-07-01') => ({ nick, points, missions: 1, at });

test('prezyvka sa ocisti rovnako ako volaci znak', () => {
  eq(cleanNick('ninka ľ'), 'NINKA Ľ', 'velke pismena + diakritika');
  eq(cleanNick('<b>hack</b>'), 'BHACKB', 'znacky vypadnu');
  eq(cleanNick('abcdefghijklmn'), 'ABCDEFGHIJ', 'orezanie na 10 znakov');
});

test('prilis kratka prezyvka neprejde', () => {
  ok(nickProblem('A'), 'jedno pismeno');
  ok(nickProblem('   '), 'medzery');
  eq(nickProblem('AB'), null, 'dve pismena staci');
});

test('vulgarizmus neprejde ani schovany v inom slove', () => {
  ok(nickProblem('kokot'), 'priamo');
  ok(nickProblem('xxfuckxx'), 'v strede slova');
  ok(nickProblem('k o k o t'), 'rozdelene medzerami');
  eq(nickProblem('LABKA'), null, 'slusna prezyvka prejde');
});

test('rebricek drzi len HALL_SIZE priecok a zoradi ich podla bodov', () => {
  const many = Array.from({ length: 30 }, (_, i) => entry(`H${i}`, i * 10));
  const list = topOf(many);
  eq(list.length, HALL_SIZE, 'pocet priecok');
  eq(list[0].points, 290, 'najlepsi je prvy');
  ok(list.every((e, i) => i === 0 || list[i - 1].points >= e.points), 'zostupne poradie');
});

test('pri rovnosti bodov je vyssie skorsi zapis', () => {
  const list = topOf([entry('NESKOR', 100, '2026-07-05'), entry('SKOR', 100, '2026-07-01')]);
  eq(list[0].nick, 'SKOR', 'prvy');
});

test('jedna prezyvka = jedna priecka', () => {
  const list = mergeEntry([entry('LABKA', 100)], entry('LABKA', 300));
  eq(list.length, 1, 'nezdvoji sa');
  eq(list[0].points, 300, 'lepsi vysledok vyhrava');
});

test('horsi vysledok neprepise lepsi', () => {
  const list = mergeEntry([entry('LABKA', 500)], entry('LABKA', 120));
  eq(list[0].points, 500, 'rekord ostava');
});

// ── Levely ──────────────────────────────────────────────────────
// Najdôležitejší test v projekte: chráni pred neriešiteľným levelom
// po tom, čo niekto poupravuje mapu.

const manifest = await (await fetch('../levels/index.json')).json();
const levels = await Promise.all(
  manifest.levels.map(async (p) => (await fetch(`../levels/${p}`)).json())
);

for (const level of levels) {
  for (const mode of ['absolute', 'relative']) {
    // V JSON je riešenie zapísané krátko cez `n`; v tabuľke je jeden riadok
    // jeden krok, takže sa pred porovnaním s limitom musí rozbaliť.
    const rows = level.solutions?.[mode] ? expandRows(level.solutions[mode]) : null;

    test(`level ${level.id} „${level.title}“ — riešenie (${mode}) prejde`, () => {
      ok(rows, 'v súbore chýba referenčné riešenie');
      const world = new World(level);
      const { vm } = run(world, rows, { stepLimit: level.limits?.steps ?? 200 });
      eq(vm.status, 'won', 'výsledok');
    });

    test(`level ${level.id} — limit riadkov (${mode}) sedí na optimálne riešenie`, () => {
      const limit = rowLimitFor(level.stars?.find((s) => s.id === 'rows'), mode);
      ok(limit, 'level nemá limit riadkov');
      eq(countRows(rows), limit, 'počet krokov optimálneho riešenia');
    });

    test(`level ${level.id} — riešenie (${mode}) pozbiera všetky kosti`, () => {
      const world = new World(level);
      run(world, expandRows(level.solutions[mode]), { stepLimit: level.limits?.steps ?? 200 });
      eq(world.bonesCollected(), world.totalBones, 'kosti');
    });
  }

  test(`level ${level.id} — mriežka je pravouhlá`, () => {
    const rows = level.grid.rows;
    ok(rows.every((r) => r.length === rows[0].length), 'riadky majú rôznu dĺžku');
  });

  test(`level ${level.id} — štart nestojí v stene`, () => {
    const world = new World(level);
    for (const a of world.actors) ok(!world.isBlocked(a.x, a.y), `aktér ${a.id} stojí v prekážke`);
  });
}

// ── Výpis ───────────────────────────────────────────────────────
const out = document.getElementById('out');
let failed = 0;
for (const [name, err] of results) {
  if (err) failed++;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="${err ? 'fail' : 'pass'}">${err ? '✕' : '✓'}</td>` +
                 `<td class="name">${name}</td><td class="fail">${err ?? ''}</td>`;
  out.append(tr);
}
const sum = document.getElementById('sum');
sum.className = `sum ${failed ? 'bad' : 'ok'}`;
sum.textContent = failed
  ? `${failed} z ${results.length} testov zlyhalo`
  : `Všetkých ${results.length} testov prešlo`;
</script>
</body>
</html>
